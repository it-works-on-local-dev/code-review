# The review workflow pins anthropics/claude-code-action to a commit, and that action installs the
# Claude Code version its own release names, so a model alias such as opus only moves on to a newer
# model when the pin does. This opens a PR each week for every action with a newer release.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
