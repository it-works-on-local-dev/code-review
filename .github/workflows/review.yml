# This repository's pull requests are reviewed through the shared workflow beside this file,
# called by its local path: a PR that changes the workflow is reviewed by its own version when it
# opens, while a /review comment runs main's. Other repositories call it at the @v1 ref from a stub
# of the same shape, which /iwol:setup writes.
name: Code Review

on:
  pull_request:
    types: [opened, ready_for_review]
    branches: [main]
  # A comment line starting "/review [claude|codex] [model] [effort] [sub|api]" asks for a fresh review
  issue_comment:
    types: [created]

jobs:
  review:
    # GitHub shows the called workflow's checks as "Code Review / Reviewer / <job>", the review job
    # named after its engine, as in "Code Review / Reviewer / Claude"
    name: Reviewer
    # The workflow posts through the review app's own token
    permissions:
      contents: read
    uses: ./.github/workflows/code-review.yml
    # Only the secrets the workflow declares, not every repository and organisation secret
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # Empty until the secret is set; then /review api runs a Claude review on it
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Empty until the secret is set; a /review codex request needs it. CODEX_AUTH_JSON isn't
      # passed: this repository is public, and OpenAI allows the stored login only in private ones
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      REVIEW_APP_PRIVATE_KEY: ${{ secrets.REVIEW_APP_PRIVATE_KEY }}
    with:
      review-app-client-id: ${{ vars.REVIEW_APP_CLIENT_ID }}
      # A Claude review runs on the OAuth token unless its /review line says api
      default-claude-credential: sub
      # A mention of @iwol-reviewer starts the request job, and a thank-you to it gets a 🎉
      review-app-slug: iwol-reviewer
      # A clean review also approves the PR's reviewed head, and one that isn't clean dismisses
      # the bot's earlier approvals
      approve: true
      # The tools are downloaded into the runner's temporary directory, so the checks need nothing
      # preinstalled on whichever runner runs them
      checks: |
        run_step setup actionlint-script curl -fsSL -o "$RUNNER_TEMP/download-actionlint.bash" https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash
        run_step setup actionlint-install bash "$RUNNER_TEMP/download-actionlint.bash" 1.7.7 "$RUNNER_TEMP"
        run_step check actionlint "$RUNNER_TEMP/actionlint"
        run_step check eyJhbGciOiJub25lIn0.eyJ0ZXN0IjoiY29kZS1yZXZpZXctNzhwLjMifQ.ZmFrZS1zaWduYXR1cmU true
