name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # The release-manager app's token, not GITHUB_TOKEN: a PR, tag or release made with
      # GITHUB_TOKEN triggers no other workflow, so the Release PR would get no CI run.
      - name: Generate release-manager app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Check out the release commit
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ steps.release.outputs.sha }}

      # Deploy step: callers pin @v<major>, so move that tag to the new release's commit.
      - name: Move the major version tag
        if: ${{ steps.release.outputs.release_created }}
        env:
          MAJOR: ${{ steps.release.outputs.major }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          git tag -f "v${MAJOR}" "${SHA}"
          git push --force origin "refs/tags/v${MAJOR}"
